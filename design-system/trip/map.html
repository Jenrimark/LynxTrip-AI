<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>地图页面内容</title>
  <style>
    html, body {
      height: auto !important;
      min-height: 0 !important;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
    }
    #mapDiv {
      width: 100%;
      height: 400px;
      min-height: 300px;
      border-radius: 8px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .info-block {
      margin-bottom: 24px;
      position: relative;
    }
    .section-title {
      font-weight: bold;
      color: rgba(255,136,57,1.00);
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .map-legend {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 5px;
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 1000;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      border: 1px solid #eee;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .legend-color {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border-radius: 50%;
    }
    .day1-color {
      background-color: #FF5722;
    }
    .day2-color {
      background-color: #4CAF50;
    }
    .day3-color {
      background-color: #2196F3;
    }
    .route-info {
      font-size: 14px;
      margin-top: 5px;
      color: #666;
    }
    /* 隐藏天地图版权信息 */
    .tdt-control-copyright,
    .tdt-control-logo,
    .Tmap_copyright,
    [class*="copyright"],
    [class*="tdt-copyright"] {
      display: none !important;
      visibility: hidden !important;
    }
  </style>
  <!-- 天地图API -->
  <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=31a83f964457a146a614479ccef14163" type="text/javascript"></script>
</head>
<body>
  <div class="info-block">
    <!-- <div class="section-title">地图页面内容</div> -->
    <div id="mapDiv"></div>
    <div class="map-legend">
      <div class="legend-item"><div class="legend-color day1-color"></div>第1天：武当山（紫霄宫、太子坡、金顶）</div>
      <div class="legend-item"><div class="legend-color day2-color"></div>第2天：竹山县（圣水湖、柑橘采摘、民歌村）</div>
      <div class="legend-item"><div class="legend-color day3-color"></div>第3天：郧阳区（烈士陵园、恐龙蛋化石群）</div>
      <div class="route-info">武汉 → 武当山 → 竹山县 → 郧阳区 → 武汉</div>
    </div>
    <!-- 底部提示 -->
    <div style="text-align: center; padding: 16px 12px; background: linear-gradient(135deg, #fff5f7 0%, #ffe5ec 100%); border-radius: 8px; margin-top: 12px; border: 1px solid #ffc0d5;">
      <span style="color: rgba(255,136,57,1.00); font-size: 14px; font-weight: 500;">📍 本地图支持实时导游导览，为您提供景点讲解，路线指引等服务</span>
    </div>
  </div>

  <script type="text/javascript">
    // 确保DOM加载完成后再初始化地图
    document.addEventListener('DOMContentLoaded', function() {
      try {
        // 初始化天地图
        var map = new T.Map("mapDiv");
        
        // 十堰市中心坐标
        var shiyanCenter = new T.LngLat(110.787918, 32.646907);
        
        // 设置地图中心点和缩放级别
        map.centerAndZoom(shiyanCenter, 9);
        
        // 添加地图控件
        map.addControl(new T.Control.Zoom());
        map.addControl(new T.Control.Scale());
        
        // 定义各个景点的坐标
        var locations = [
          {
            name: "武当山",
            lnglat: new T.LngLat(111.044399, 32.405895),
            day: 1,
            color: "#FF5722",
            description: "Day 1: 紫霄宫、太子坡、金顶<br>住宿：武当山特色民宿（预算300元/晚）<br>特产：武当道茶、黄精酒"
          },
          {
            name: "竹山县",
            lnglat: new T.LngLat(110.228869, 32.224875),
            day: 2,
            color: "#4CAF50",
            description: "Day 2: 圣水湖、柑橘采摘、官渡镇民歌村<br>住宿：竹山农家乐（预算200元/晚）<br>特产：竹山柑橘、郧阳红薯粉"
          },
          {
            name: "郧阳区",
            lnglat: new T.LngLat(110.812050, 32.834850),
            day: 3,
            color: "#2196F3",
            description: "Day 3: 革命烈士陵园、青龙山恐龙蛋化石群<br>傍晚高铁返回武汉"
          }
        ];
        
        // 添加标记点
        locations.forEach(function(loc, index) {
          // 创建简单标记
          var marker = new T.Marker(loc.lnglat);
          map.addOverLay(marker);
          
          // 添加地点名称标签
          var label = new T.Label({
            text: (index + 1) + ". " + loc.name,
            position: new T.LngLat(loc.lnglat.lng, loc.lnglat.lat + 0.03),
            offset: new T.Point(0, 0)
          });
          map.addOverLay(label);
        });
        
        // 绘制路线
        function drawRoute(points, color, width) {
          // 创建折线对象
          var polyline = new T.Polyline(points, {
            color: color,
            weight: width,
            opacity: 0.8
          });
          map.addOverLay(polyline);
        }
        
        // 武汉坐标
        var wuhanPoint = new T.LngLat(114.305393, 30.593099);
        
        // 创建武汉标记
        var wuhanMarker = new T.Marker(wuhanPoint);
        map.addOverLay(wuhanMarker);
        
        // 添加武汉标签
        var wuhanLabel = new T.Label({
          text: "武汉（起点/终点）",
          position: new T.LngLat(wuhanPoint.lng, wuhanPoint.lat + 0.05),
          offset: new T.Point(0, 0)
        });
        map.addOverLay(wuhanLabel);
        
        // 绘制完整路线
        // 武汉到武当山的路线
        drawRoute([wuhanPoint, locations[0].lnglat], "#FF5722", 3);
        
        // 武当山到竹山县的路线
        drawRoute([locations[0].lnglat, locations[1].lnglat], "#4CAF50", 3);
        
        // 竹山县到郧阳区的路线
        drawRoute([locations[1].lnglat, locations[2].lnglat], "#2196F3", 3);
        
        // 郧阳区到武汉的路线
        drawRoute([locations[2].lnglat, wuhanPoint], "#9C27B0", 3);
        
        console.log('地图初始化完成');
      } catch (error) {
        console.error('地图初始化失败:', error);
        document.getElementById('mapDiv').innerHTML = '<div style="padding:20px;color:red;">地图加载失败: ' + error.message + '</div>';
      }
    });
  </script>
</body>
</html>
