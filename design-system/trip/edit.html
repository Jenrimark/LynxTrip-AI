<style>
  .edit-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .edit-toolbar .side-btn {
    background: #eef2ff;
    color: #6c63ff;
    border: none;
    border-radius: 8px;
    padding: 6px 22px;
    font-size: 1rem;
    cursor: pointer;
    margin: 0;
  }
  .edit-table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    font-size: 15px;
  }
  .edit-table th, .edit-table td {
    border: 1px solid #f0f0f0;
    padding: 8px 8px;
    text-align: left;
    background: #fff;
  }
  .edit-table th {
    background: #f7f7fa;
    color: #888;
    font-weight: normal;
  }
  .edit-table input, .edit-table select {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-size: 15px;
    padding: 2px 4px;
  }
  .edit-table .op-btn {
    background: #f9f9f9;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    cursor: pointer;
    color: rgba(255,136,57,1.00);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .edit-table .op-btn:hover {
    background: #ffe6ef;
  }
  .edit-table .add-row {
    background: #fafbfc;
  }
  .edit-table .add-row input, .edit-table .add-row select {
    background: #fafbfc;
  }
  body, html {
    overflow: hidden !important;
  }
</style>

<script>
  // 删除按钮事件
  function bindDeleteBtns() {
    document.querySelectorAll('.op-btn[title="删除"]').forEach(function(btn){
      btn.onclick = function(){
        var tr = btn.closest('tr');
        tr.parentNode.removeChild(tr);
      };
    });
  }
  bindDeleteBtns();

  // 新添行确认
  document.getElementById('confirm-add-btn').onclick = function() {
    var row = document.getElementById('editable-row');
    var inputs = row.querySelectorAll('input,select');
    var values = [];
    inputs.forEach(function(input) {
      values.push(input.value);
    });
    // 校验必填
    if(!values[0] || !values[1] || !values[2]) {
      alert('天、顺序、活动为必填项');
      return;
    }
    var tbody = document.getElementById('trip-table-body');
    var newRow = document.createElement('tr');
    newRow.innerHTML =
      '<td><input type="text" value="'+values[0]+'"></td>' +
      '<td><input type="text" value="'+values[1]+'"></td>' +
      '<td><input type="text" value="'+values[2]+'"></td>' +
      '<td><input type="text" value="'+values[3]+'"></td>' +
      '<td><input type="text" value="'+values[4]+'"></td>' +
      '<td><select><option>'+values[5]+'</option><option>武当山 cn</option><option>竹山县 cn</option><option>郧阳区 cn</option></select></td>' +
      '<td><button class="op-btn" title="删除">&#128465;</button></td>';
    tbody.appendChild(newRow);
    bindDeleteBtns();
    // 清空输入
    inputs.forEach(function(input){
      if(input.tagName === 'SELECT') input.selectedIndex = 0;
      else input.value = '';
    });
  };
</script>
